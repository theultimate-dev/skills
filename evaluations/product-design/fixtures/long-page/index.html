<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Long page: four bands</title>
  <style>
    body { margin: 0; font: 700 6rem/1 system-ui, sans-serif; }
    section { box-sizing: border-box; height: 1000px; padding: 1rem 2rem; color: #fafaf7; }
    h2 { margin: 0; font-size: inherit; }
    section:nth-child(odd) { background: #205d42; }
    section:nth-child(even) { background: #526057; }
  </style>
</head>
<body>
  <section><h2>0</h2></section>
  <section><h2>1000</h2></section>
  <section><h2>2000</h2></section>
  <section><h2>3000</h2></section>
</body>
</html>
