# Turns a pushed tag on main into a GitHub Release.
# vX.Y.Z releases the marketplace from CHANGELOG.md, notes only.
# PLUGIN--vX.Y.Z releases one plugin from skills/PLUGIN/CHANGELOG.md, with one zip per skill in that plugin plus checksums.
# Every plugin release is also a marketplace release (decisions/0011), so a plugin tag needs the marketplace release at its commit to list it.
# Same workflow as skills/foundations/release-process/templates/release-components.yml, plus the "Check the manifest", "Check the marketplace release" and "Package the plugin" steps, with actions pinned to commit SHAs.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*--v*.*.*"
  # GitHub starts no run when one push carries more than three tags. Start those by hand with the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, such as v0.2.0 or foundations--v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      ROOT_CHANGELOG: CHANGELOG.md
      COMPONENT_CHANGELOG: "skills/{component}/CHANGELOG.md"
    steps:
      - name: Parse the tag
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ "$TAG" == *--v* ]]; then
            component="${TAG%%--v*}"
            version="${TAG#*--v}"
            if [[ ! "$component" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::Tag '$TAG' names component '$component', which is not kebab-case"; exit 1
            fi
            changelog="${COMPONENT_CHANGELOG//"{component}"/$component}"
          elif [[ "$TAG" == v* ]]; then
            component=""
            version="${TAG#v}"
            changelog="$ROOT_CHANGELOG"
          else
            echo "::error::Tag '$TAG' is neither vMAJOR.MINOR.PATCH nor NAME--vMAJOR.MINOR.PATCH"; exit 1
          fi
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Tag '$TAG' carries version '$version', which is not MAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          {
            echo "COMPONENT=$component"
            echo "VERSION=$version"
            echo "CHANGELOG=$changelog"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          SHA="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tag $TAG points at $SHA, which is not on main. Releases come from main only."; exit 1
          fi

      - name: Extract release notes
        run: |
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::$CHANGELOG does not exist at $TAG.${COMPONENT:+ Is '$COMPONENT' a component of this repository?}"; exit 1
          fi
          # Prints the body of the '## [ver]' section; the marketplace check reuses it.
          cat > "$RUNNER_TEMP/section.awk" <<'AWK'
          BEGIN { head = "## [" ver "]"; n = length(head) }
          /^[ \t]*(```|~~~)/ { fence = !fence; if (inside) print; next }
          fence              { if (inside) print; next }
          /^\[[^]]+\]: /     { if (inside) exit; next }
          /^## /             { if (inside) exit; if (substr($0, 1, n) == head) inside = 1; next }
          inside             { print }
          AWK
          awk -v ver="$VERSION" -f "$RUNNER_TEMP/section.awk" "$CHANGELOG" > "$RUNNER_TEMP/notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "::error::$CHANGELOG has no entries under '## [$VERSION]'. Release the changelog before tagging."; exit 1
          fi

      # Route A users get an update only when marketplace.json declares a new version, so the tag must match it.
      # The validator ties that version to the newest section of the changelog, so an older section cannot be re-released.
      - name: Check the manifest at the tag
        run: |
          python3 scripts/validate.py
          if [ -n "$COMPONENT" ]; then
            declared="$(jq -r --arg p "$COMPONENT" '.plugins[] | select(.name == $p) | .version' .claude-plugin/marketplace.json)"
            where="the '$COMPONENT' plugin entry"
          else
            declared="$(jq -r '.metadata.version' .claude-plugin/marketplace.json)"
            where="metadata.version"
          fi
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::.claude-plugin/marketplace.json declares '${declared:-nothing}' in $where, not $VERSION. Bump it in the release commit."; exit 1
          fi

      # Every plugin release is also a marketplace release in the same commit, whose section links the plugin's release.
      # The validator ties metadata.version to the newest section of the root changelog.
      - name: Check the marketplace release lists the plugin
        if: env.COMPONENT != ''
        run: |
          marketplace="$(jq -r '.metadata.version' .claude-plugin/marketplace.json)"
          awk -v ver="$marketplace" -f "$RUNNER_TEMP/section.awk" "$ROOT_CHANGELOG" > "$RUNNER_TEMP/marketplace.md"
          if ! grep -qF "/releases/tag/$TAG)" "$RUNNER_TEMP/marketplace.md"; then
            echo "::error::$ROOT_CHANGELOG section $marketplace does not link $TAG. Release the marketplace in the same commit, listing the plugin under Changed."; exit 1
          fi

      - name: Package the plugin's skills
        if: env.COMPONENT != ''
        run: |
          mkdir -p dist
          # Commit time on every entry and a sorted entry list, so re-runs build identical archives and checksums.
          find "skills/$COMPONENT" -exec touch -d "@$(git log -1 --format=%ct)" {} +
          for skill in "skills/$COMPONENT"/*/; do
            name="$(basename "$skill")"
            ( cd "skills/$COMPONENT" \
              && find "$name" ! -name '.DS_Store' ! -path '*/__pycache__*' | LC_ALL=C sort \
              | zip -qX "$GITHUB_WORKSPACE/dist/${name}-${VERSION}.zip" -@ )
          done
          ( cd dist && sha256sum *.zip > checksums.txt )
          ls -l dist

      - name: Create the GitHub Release
        run: |
          shopt -s nullglob
          title="${COMPONENT:+$COMPONENT }v$VERSION"
          # Marketplace releases are Latest; plugin releases never are, so the latest-release link stays on the marketplace.
          flags=(--latest=false)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          elif [ -z "$COMPONENT" ]; then
            flags=(--latest)
          fi
          assets=(dist/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$TAG" "${assets[@]}" --clobber
            else
              echo "Release $TAG already exists; nothing to do."
            fi
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag \
              "${flags[@]}"
          fi
