<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture</title>
<!--
  The built architecture page. It draws the Markdown views and studies copied into the source blocks below.
  The Markdown files stay the source of truth. Change only the stamp line and the source blocks between
  "sources: begin" and "sources: end", as references/building-the-page.md in drawing-architecture-views says.
-->
<style id="style">
:root { color-scheme: light; --bg: #ffffff; --fg: #1d2125; --muted: #57616b; --line: #d3d9df; --panel: #f4f6f8; --code: #eceff2; --accent: #0b5cad; --on-accent: #ffffff; --bad: #b42318; --bad-bg: #fdecea; --note-bg: #fff6dc; --note-line: #e3c25a; --built: #1a7f37; --planned: #9a6700; --proposed: #7438c2; --other: #57616b; }
:root[data-theme="dark"] { color-scheme: dark; --bg: #15181b; --fg: #e3e6e9; --muted: #9ba5af; --line: #353c43; --panel: #1c2024; --code: #262b31; --accent: #6cb0ff; --on-accent: #0d1117; --bad: #ff8b7e; --bad-bg: #3a1d1a; --note-bg: #322a12; --note-line: #8a7120; --built: #57d07a; --planned: #e3b341; --proposed: #c39bff; --other: #9ba5af; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
a { color: var(--accent); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.top #title { font-size: 16px; }
#stamp { margin: 0; color: var(--muted); font-size: 13px; }
#stamp code { font-size: 12px; }
.tools { margin-left: auto; display: flex; gap: 6px; }
#notice { margin: 0; padding: 10px 16px; background: var(--note-bg); border-bottom: 1px solid var(--note-line); }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
nav { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 10px 8px 16px; font-size: 14px; }
nav h2 { margin: 14px 6px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
nav a { display: block; padding: 4px 8px; border-radius: 5px; color: var(--fg); text-decoration: none; }
nav a:hover { background: var(--code); }
nav a.on, nav a.on:hover { background: var(--accent); color: var(--on-accent); }
nav a.on .pill { color: inherit; border-color: currentColor; }
nav a.sub { margin-left: 14px; font-size: 13px; }
nav .study { margin-top: 4px; }
nav .date { display: block; padding: 0 8px; font-size: 11px; color: var(--muted); }
#checks { margin: 18px 6px 0; }
#checks summary { cursor: pointer; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#results { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
main { overflow: auto; min-width: 0; }
.doc { max-width: 1100px; padding: 16px 28px 48px; }
.doc .path { margin: 0 0 2px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.doc h1 { font-size: 26px; line-height: 1.25; margin: 0 0 10px; }
.doc h2 { font-size: 19px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 16px; margin: 22px 0 6px; }
.doc h4, .doc h5, .doc h6 { font-size: 15px; margin: 18px 0 6px; }
.doc p, .doc li { max-width: 80ch; }
.doc p { margin: 8px 0; }
.doc ul, .doc ol { padding-left: 24px; margin: 8px 0; }
.doc blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.doc code { font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.doc pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow: auto; font-size: 13px; line-height: 1.45; }
.doc pre code { background: none; padding: 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.doc .table { overflow: auto; max-height: 75vh; margin: 10px 0; }
.doc table { border-collapse: collapse; font-size: 13.5px; }
.doc th, .doc td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.doc th { position: sticky; top: 0; z-index: 1; background: var(--panel); font-weight: 600; box-shadow: inset 0 1px 0 var(--line), inset 0 -1px 0 var(--line); }
.doc a.broken { color: var(--bad); text-decoration: line-through; }
.doc .img { color: var(--muted); font-style: italic; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 14px; }
.pill { display: inline-block; padding: 0 8px; border: 1px solid currentColor; border-radius: 10px; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--other); }
.pill.built { color: var(--built); } .pill.planned { color: var(--planned); } .pill.proposed { color: var(--proposed); }
.status .pill { font-size: 13px; line-height: 20px; }
.frame { position: relative; height: 320px; margin: 12px 0 6px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.frame.dragging { cursor: grabbing; }
.frame:fullscreen { height: 100vh; border: 0; border-radius: 0; }
.frame .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.frame .stage svg { display: block; }
.frame .bar { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.frame .bar button { background: var(--panel); }
.frame .hint { position: absolute; left: 8px; bottom: 6px; margin: 0; padding: 0 4px; border-radius: 3px; background: var(--bg); font-size: 11px; color: var(--muted); pointer-events: none; }
.diagram-error { margin: 12px 0 0; padding: 8px 12px; border-radius: 6px 6px 0 0; background: var(--bad-bg); color: var(--bad); font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
.not-drawn .diagram-error { background: var(--note-bg); color: var(--fg); }
.diagram-error + pre { margin-top: 0; border-radius: 0 0 6px 6px; }
.compare-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100% - 45px); }
.side { overflow: auto; min-width: 0; border-right: 1px solid var(--line); }
.side:last-child { border-right: 0; }
.side select { margin: 10px 14px 0; max-width: calc(100% - 28px); }
.side .doc { padding: 10px 14px 32px; }
.empty { padding: 24px 28px; color: var(--muted); max-width: 70ch; }
#measure { position: absolute; left: -20000px; top: 0; visibility: hidden; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  nav { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .compare { grid-template-columns: 1fr; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .doc { padding: 12px 16px 32px; }
}
</style>
</head>
<body>
<header class="top">
  <strong id="title">Architecture</strong>
  <p id="stamp">Built <time>not yet</time> from <code>no commit</code></p>
  <span class="tools"><button id="compare-btn" type="button">Compare</button><button id="theme-btn" type="button">Theme</button><button id="save-btn" type="button" disabled>Save offline copy</button></span>
</header>
<p id="notice" role="alert" hidden></p>
<div class="layout">
  <nav><div id="toc"></div><details id="checks" open><summary>Checks</summary><pre id="results">Drawing...</pre></details></nav>
  <main id="main"></main>
</div>
<div id="measure" aria-hidden="true"></div>
<div id="sources" hidden>
<!-- sources: begin -->
<!-- sources: end -->
</div>
<script id="runtime">
/* Shows the views: switcher, compare, pan and zoom. The offline copy carries this script and nothing else. */
function ArchViewer(data, opts) {
  'use strict';
  opts = opts || {};
  var doc = document, root = doc.documentElement, main = doc.getElementById('main');
  var byPath = {}, frames = [], pendingAnchor = null;
  data.sources.forEach(function (s) { byPath[s.path] = s; });
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function enc(p) { return encodeURI(p).replace(/#/g, '%23').replace(/,/g, '%2C'); }
  function dec(p) { try { return decodeURIComponent(p); } catch (e) { return p; } }
  function home() { return byPath['README.md'] ? 'README.md' : (data.sources[0] || {}).path; }
  function pill(st) { return st ? ' <span class="pill ' + esc(st) + '">' + esc(st) + '</span>' : ''; }
  function link(s, cls) { return '<a class="' + cls + '" href="#view=' + enc(s.path) + '" data-path="' + esc(s.path) + '" title="' + esc(s.path) + '">' + esc(s.label) + pill(s.status) + '</a>'; }
  function groups() {
    var g = { index: [], standing: [], studies: [] }, studies = {};
    data.sources.forEach(function (s) {
      if (s.group !== 'study') { g[s.group].push(s); return; }
      if (!studies[s.study]) { studies[s.study] = { key: s.study, readme: null, views: [] }; g.studies.push(studies[s.study]); }
      if (s.path === s.study + '/README.md') studies[s.study].readme = s; else studies[s.study].views.push(s);
    });
    g.studies.sort(function (a, b) { return a.key < b.key ? 1 : -1; });
    return g;
  }
  function nav() {
    var g = groups(), h = '';
    g.index.forEach(function (s) { h += link(s, 'index'); });
    if (g.standing.length) h += '<h2>Standing views</h2>' + g.standing.map(function (s) { return link(s, ''); }).join('');
    if (g.studies.length) {
      h += '<h2>Studies</h2>';
      g.studies.forEach(function (st) {
        var slug = st.key.split('/')[1] || st.key, date = /^\d{4}-\d{2}-\d{2}/.exec(slug);
        h += '<div class="study">' + (st.readme ? link(st.readme, '') : '<a>' + esc(slug) + '</a>') + (date ? '<span class="date">' + date[0] + '</span>' : '') + st.views.map(function (s) { return link(s, 'sub'); }).join('') + '</div>';
      });
    }
    doc.getElementById('toc').innerHTML = h;
  }
  function picker(sel) {
    var g = groups(), h = '<select aria-label="Source to compare">';
    function opt(s, pre) { return '<option value="' + esc(s.path) + '"' + (s.path === sel ? ' selected' : '') + '>' + esc((pre || '') + s.label) + '</option>'; }
    g.index.forEach(function (s) { h += opt(s); });
    if (g.standing.length) h += '<optgroup label="Standing views">' + g.standing.map(function (s) { return opt(s); }).join('') + '</optgroup>';
    g.studies.forEach(function (st) { h += '<optgroup label="Study ' + esc(st.key.split('/')[1] || st.key) + '">' + (st.readme ? opt(st.readme) : '') + st.views.map(function (s) { return opt(s, '- '); }).join('') + '</optgroup>'; });
    return h + '</select>';
  }
  function mount(box, path) {
    var s = byPath[path];
    if (!s) { box.innerHTML = '<p class="empty">This page holds no source named <code>' + esc(path || '') + '</code>.</p>'; return; }
    box.innerHTML = '<article class="doc" data-path="' + esc(s.path) + '"><p class="path">' + esc(s.path) + '</p>' + s.html + '</article>';
    [].forEach.call(box.querySelectorAll('.diagram'), function (host) { fill(host, s.diagrams[+host.getAttribute('data-i')] || {}); });
  }
  function fill(host, d) {
    if (!d.svg) {
      host.className = 'diagram ' + (d.notDrawn ? 'not-drawn' : 'failed');
      host.innerHTML = '<div class="diagram-error">' + esc(d.error || 'Not drawn') + '</div><pre><code>' + esc(d.code || '') + '</code></pre>';
      return;
    }
    host.innerHTML = '<div class="frame"><div class="stage">' + d.svg + '</div><div class="bar"><button type="button" data-act="in" title="Zoom in">+</button><button type="button" data-act="out" title="Zoom out">&minus;</button><button type="button" data-act="fit">Fit</button><button type="button" data-act="full">Full screen</button></div><p class="hint">Drag to pan. Ctrl or &#8984; with the wheel, or pinch, to zoom.</p></div>';
    panZoom(host.firstChild);
  }
  function panZoom(frame) {
    var stage = frame.firstChild, svg = stage.querySelector('svg'), vb = svg.viewBox && svg.viewBox.baseVal;
    var w = vb && vb.width ? vb.width : (svg.getBBox().width || 400), h = vb && vb.height ? vb.height : (svg.getBBox().height || 300);
    var s = 1, x = 0, y = 0, drag = null, moved = false, lastWidth = 0;
    svg.setAttribute('width', w); svg.setAttribute('height', h); svg.style.maxWidth = 'none';
    function full() { return doc.fullscreenElement === frame; }
    function apply() { stage.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')'; }
    function size() {
      if (full()) { frame.style.height = ''; return; }
      var k = Math.min((frame.clientWidth - 24) / w, 1);
      frame.style.height = Math.round(Math.max(160, Math.min(h * k + 40, window.innerHeight * 0.85))) + 'px';
    }
    function fit() {
      size();
      var fw = frame.clientWidth, fh = frame.clientHeight;
      moved = false; lastWidth = fw;
      s = Math.max(0.05, Math.min((fw - 24) / w, (fh - 40) / h, full() ? 2.5 : 1));
      x = (fw - w * s) / 2; y = Math.max(8, (fh - h * s) / 2); apply();
    }
    function zoom(k, px, py) { moved = true; var ns = Math.min(8, Math.max(0.05, s * k)); k = ns / s; x = px - (px - x) * k; y = py - (py - y) * k; s = ns; apply(); }
    frame.addEventListener('wheel', function (e) {
      if (!(e.ctrlKey || e.metaKey || full())) return;
      e.preventDefault(); var r = frame.getBoundingClientRect(); zoom(Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    frame.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || e.target.closest('.bar')) return;
      drag = { px: e.clientX, py: e.clientY, x: x, y: y }; frame.classList.add('dragging');
      try { frame.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    });
    frame.addEventListener('pointermove', function (e) { if (drag) { moved = true; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; apply(); } });
    function stop() { drag = null; frame.classList.remove('dragging'); }
    frame.addEventListener('pointerup', stop); frame.addEventListener('pointercancel', stop);
    frame.querySelector('.bar').addEventListener('click', function (e) {
      var act = e.target.getAttribute('data-act');
      if (act === 'in' || act === 'out') zoom(act === 'in' ? 1.25 : 0.8, frame.clientWidth / 2, frame.clientHeight / 2);
      else if (act === 'fit') fit();
      else if (act === 'full') {
        if (full()) { doc.exitFullscreen(); return; }
        frame.setAttribute('data-fullscreen', 'requested');
        var p = frame.requestFullscreen ? frame.requestFullscreen() : null;
        if (p && p.catch) p.catch(function () { frame.setAttribute('data-fullscreen', 'refused'); });
      }
    });
    frame.fit = fit; frames.push(frame);
    requestAnimationFrame(fit);
    /* Refit an untouched diagram when its frame's width changes, such as when a scrollbar appears beside it. */
    if (window.ResizeObserver) new ResizeObserver(function () { if (!moved && frame.clientWidth !== lastWidth) fit(); }).observe(frame);
  }
  function refit() { frames = frames.filter(function (f) { return f.isConnected; }); frames.forEach(function (f) { f.fit(); }); }
  function mark(paths) { [].forEach.call(doc.querySelectorAll('#toc a[data-path]'), function (a) { a.classList.toggle('on', paths.indexOf(a.getAttribute('data-path')) >= 0); }); }
  function state() {
    var m = /^#(view|compare)=(.*)$/.exec(location.hash);
    if (m && m[1] === 'compare') { var p = m[2].split(','); return { compare: [dec(p[0] || ''), dec(p[1] || '')] }; }
    return { view: m ? dec(m[2]) : home() };
  }
  function route() {
    var st = state(); frames = [];
    if (!data.sources.length) { main.innerHTML = '<p class="empty">' + (data.empty || 'This page holds no sources.') + '</p>'; return; }
    if (st.compare) {
      main.innerHTML = '<div class="compare-bar"><strong>Compare</strong><span class="hint">Each side pans and zooms on its own.</span><button type="button" data-close>Close</button></div><div class="compare"><section class="side">' + picker(st.compare[0]) + '<div class="body"></div></section><section class="side">' + picker(st.compare[1]) + '<div class="body"></div></section></div>';
      var sides = main.querySelectorAll('.side');
      [0, 1].forEach(function (k) { mount(sides[k].querySelector('.body'), st.compare[k]); });
      mark(st.compare); doc.title = 'Compare: ' + st.compare.join(', ') + ' - ' + data.title;
    } else {
      mount(main, st.view); main.scrollTop = 0; mark([st.view]);
      doc.title = (byPath[st.view] ? byPath[st.view].label + ' - ' : '') + data.title;
    }
    if (pendingAnchor) { var a = pendingAnchor; pendingAnchor = null; scrollTo(main, a); }
  }
  function scrollTo(box, slug) { var t = box.querySelector('[data-slug="' + slug.replace(/["\\]/g, '') + '"]'); if (t) t.scrollIntoView(); }
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
  main.addEventListener('change', function (e) {
    if (e.target.tagName !== 'SELECT') return;
    var v = [].map.call(main.querySelectorAll('.side select'), function (s) { return enc(s.value); });
    go('#compare=' + v.join(','));
  });
  main.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { go('#view=' + enc(state().compare[0])); return; }
    var a = e.target.closest('a[data-anchor]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (href.charAt(0) === '#' && /^#(view|compare)=/.test(href)) { pendingAnchor = a.getAttribute('data-anchor') || null; if (location.hash === href) route(); return; }
    e.preventDefault(); scrollTo(a.closest('article') || main, a.getAttribute('data-anchor'));
  });
  var cmp = doc.getElementById('compare-btn');
  if (cmp) cmp.addEventListener('click', function () {
    var st = state();
    if (st.compare) { go('#view=' + enc(st.compare[0])); return; }
    var cur = byPath[st.view] ? st.view : home(), cs = byPath[cur] || {};
    var other = data.sources.filter(function (s) { return s.path !== cur && s.group !== 'index' && (cs.group === 'study' ? s.group === 'standing' : s.group === 'study' && !/README\.md$/.test(s.path)); })[0] ||
      data.sources.filter(function (s) { return s.path !== cur; })[0] || cs;
    go('#compare=' + enc(cur) + ',' + enc(other.path || ''));
  });
  addEventListener('hashchange', route);
  addEventListener('resize', refit);
  doc.addEventListener('fullscreenchange', function () { setTimeout(refit, 60); });
  root.setAttribute('data-theme', data.theme);
  doc.getElementById('title').textContent = data.title;
  nav(); route();
  return { refresh: function () { root.setAttribute('data-theme', data.theme); nav(); route(); } };
}
</script>
<script id="builder">
/* Reads the source blocks, renders the Markdown, draws the diagrams, writes the check lines, saves the offline copy. */
(function () {
  'use strict';
  var MERMAID_URL = 'https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.min.js';
  var doc = document, results = doc.getElementById('results'), notice = doc.getElementById('notice');
  var data = { title: 'Architecture', theme: 'light', sources: [] }, viewer = null, chosenTheme = null, seq = 0;
  var media = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  data.theme = media && media.matches ? 'dark' : 'light';
  doc.documentElement.setAttribute('data-theme', data.theme);

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function short(t, n) { t = String(t).replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '\u2026' : t; }

  /* ---- Source blocks ---- */
  function unescapeSource(t) { return t.replace(/<\\(\\*)(\/script|!--)/gi, '<$1$2'); }
  function readBlocks() {
    var seen = {}, out = [];
    [].forEach.call(doc.querySelectorAll('#sources script[type="text/markdown"]'), function (b) {
      var path = b.getAttribute('data-path') || '', text = b.textContent, problems = [];
      if (text.charAt(0) === '\n') text = text.slice(1);
      text = unescapeSource(text).replace(/\r\n?/g, '\n');
      var n = b.nextSibling;
      while (n && n.nodeType === 3 && !n.data.trim()) n = n.nextSibling;
      if (!n || n.nodeType !== 8 || n.data.trim() !== 'end ' + path) problems.push('the block does not end on its own closing marker line; a closing script tag or comment opener in the source was probably not escaped');
      if (/\n<script type="text\/markdown"/.test(text)) problems.push('the block runs into the next block; its closing marker line is missing');
      if (!path || /^\/|^\.\/|\\/.test(path)) problems.push('data-path must be the path relative to the architecture folder, with forward slashes');
      if (seen[path]) problems.push('a second block has the same path');
      if (!text.trim()) problems.push('the file is empty');
      seen[path] = true;
      out.push({ path: path, text: text, problems: problems });
    });
    return out;
  }

  /* ---- Markdown ---- */
  var RE = {
    fence: /^ {0,3}(`{3,}|~{3,})\s*([^\s`]*)/,
    heading: /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/,
    hr: /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/,
    quote: /^ {0,3}>/,
    item: /^( {0,3})([-*+]|\d{1,9}[.)])( +|$)/,
    delim: /^ *\|? *:?-+:? *(\| *:?-+:? *)*\|? *$/,
    comment: /^ {0,3}<!-{2}/
  };

  /* ---- Start ---- */

  start().catch(function (e) { results.textContent = 'FAIL page: ' + parseError(e) + '\nDONE 0/1'; });
})();
